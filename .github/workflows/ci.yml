name: Multi-Layer QA CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium browser
        run: python -m playwright install chromium --with-deps

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Verification (Mypy strict)
        run: mypy sut qa_framework tests scripts

      - name: Run 3-Layer QA Suite and Generate Reports
        env:
          QA_MOBILE_MODE: mock
        run: python scripts/generate_reports.py

      - name: Upload QA Telemetry, HTML Report & Visual Proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-telemetry-artifacts
          path: |
            reports/qa-summary.json
            reports/qa-report.html
            docs/images/qa-pyramid-report.png
            docs/images/playwright-e2e.png
            docs/images/playwright-mobile-390x844.png
