[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-automation-suite"
version = "1.0.0"
description = "Multi-Layer QA Automation Framework (API/Hypothesis + Playwright E2E + Appium/ADB Android Harness) with deterministic FinTech SUT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anwar", email = "anwar@example.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "PyJWT>=2.8.0",
  "matplotlib>=3.9.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "hypothesis>=6.100.0",
  "playwright>=1.45.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest-json-report>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sut*", "qa_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
  "api: Layer 1 API contract and RBAC tests",
  "property: Layer 1 Hypothesis property-based and stateful fuzzing tests",
  "web: Layer 2 Playwright headless browser E2E tests",
  "mobile: Layer 3 Appium/ADB Android mobile QA tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build", "dist", ".venv"]
